name: Secret scan

# Scans only the commits in the PR or push. Known public values (the anon key in
# 002_cron_jobs.sql) are already in history and won't be flagged again.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown
