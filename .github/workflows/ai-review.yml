name: AI review

# Claude reviews each non-draft PR using the project's own review checklist.
# Needs one repo secret: CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            Review PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/skills/pr-review/SKILL.md exactly, using `gh pr diff ${{ github.event.pull_request.number }}` as the diff.
            Read CLAUDE.md and the .claude/rules/ files that apply to the changed paths.
            Changes under supabase/migrations/ get the most scrutiny: walk through what an
            attacker holding only the anon key, or a logged-in non-admin, can do after the migration.
            Post the result as one PR comment, passing the body on stdin so no file is needed:
              gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file - <<'EOF'
              ...
              EOF
            --edit-last keeps one review comment per PR across pushes. Don't approve or request changes.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*)"
