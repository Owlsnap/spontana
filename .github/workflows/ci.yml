name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Existing code has lint errors (see CLAUDE.md, Known debt). Reported, not blocking,
      # until they're cleared. Then delete continue-on-error.
      - run: npm run lint
        continue-on-error: true
